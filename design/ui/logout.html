<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Logout — UI Mockup</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in { animation: fadeIn 0.4s ease-out both; }
  </style>
</head>
<body class="font-['Inter',system-ui,-apple-system,sans-serif] min-h-screen bg-gradient-to-br from-slate-50 via-blue-50 to-slate-100 flex flex-col">

  <!-- ====== NAV (authenticated state) ====== -->
  <nav class="bg-white/80 backdrop-blur-sm border-b border-slate-200 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between h-14">
      <a href="landingPage.html" class="text-lg font-bold bg-gradient-to-r from-blue-600 to-indigo-600 bg-clip-text text-transparent">
        Model Helper
      </a>
      <!-- Authenticated user nav -->
      <div id="nav-authed" class="flex items-center gap-4 text-sm">
        <span class="text-slate-600 hidden sm:inline">alice@example.com</span>
        <button onclick="triggerLogout()" class="inline-flex items-center gap-1.5 text-slate-600 hover:text-red-600 font-medium transition-colors focus:outline-none focus:underline">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9" />
          </svg>
          Sign out
        </button>
      </div>
    </div>
  </nav>

  <!-- ====== MAIN ====== -->
  <main class="flex-1 flex items-center justify-center px-4 sm:px-6 lg:px-8 py-12">
    <div class="w-full max-w-md animate-fade-in">

      <!-- STATE: Signed in — confirm sign out -->
      <div id="view-confirm">
        <div class="bg-white/80 backdrop-blur-sm rounded-2xl shadow-xl border border-white/50 p-6 sm:p-8 text-center">
          <div class="w-14 h-14 rounded-full bg-slate-100 flex items-center justify-center mx-auto mb-4">
            <svg class="w-7 h-7 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9" />
            </svg>
          </div>
          <h1 class="text-2xl font-bold text-slate-900 mb-2">Sign out</h1>
          <p class="text-slate-500 text-sm mb-6">You are signed in as <span class="font-semibold text-slate-700">alice@example.com</span>. Are you sure you want to sign out?</p>
          <div class="flex flex-col sm:flex-row gap-3">
            <button
              onclick="triggerLogout()"
              class="flex-1 inline-flex items-center justify-center gap-2 bg-gradient-to-r from-red-600 to-rose-600 text-white font-semibold rounded-xl px-6 py-3 hover:from-red-700 hover:to-rose-700 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2 shadow-lg shadow-red-500/20 transition-all duration-200 text-sm"
            >
              Yes, sign out
            </button>
            <a
              href="landingPage.html"
              class="flex-1 inline-flex items-center justify-center gap-2 border border-slate-200 text-slate-700 font-semibold rounded-xl px-6 py-3 hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-all duration-200 text-sm"
            >
              Cancel
            </a>
          </div>
        </div>
      </div>

      <!-- STATE: Signed out — confirmation message -->
      <div id="view-signed-out" class="hidden">
        <div class="bg-white/80 backdrop-blur-sm rounded-2xl shadow-xl border border-white/50 p-6 sm:p-8 text-center">
          <div class="w-16 h-16 rounded-full bg-emerald-100 flex items-center justify-center mx-auto mb-4">
            <svg class="w-8 h-8 text-emerald-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
          </div>
          <h2 class="text-xl font-bold text-slate-900 mb-2">You've been signed out</h2>
          <p class="text-slate-500 text-sm mb-6">Your session has been ended securely. Thanks for using Model Helper.</p>
          <a href="login.html" class="w-full inline-flex items-center justify-center gap-2 bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-semibold rounded-xl px-6 py-3 hover:from-blue-700 hover:to-indigo-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 shadow-lg shadow-blue-500/25 transition-all duration-200 text-sm">
            Sign in again
          </a>
        </div>
      </div>

      <!-- Simulation controls -->
      <div class="mt-6 bg-white/60 backdrop-blur-sm rounded-2xl border border-dashed border-slate-300 p-4">
        <p class="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-3">Mockup — simulate states</p>
        <div class="flex flex-wrap gap-2">
          <button onclick="showView('confirm')" class="text-xs px-3 py-1.5 rounded-lg bg-slate-100 text-slate-700 font-medium hover:bg-slate-200 transition-colors">Signed in (confirm)</button>
          <button onclick="triggerLogout()" class="text-xs px-3 py-1.5 rounded-lg bg-emerald-100 text-emerald-700 font-medium hover:bg-emerald-200 transition-colors">After sign out</button>
        </div>
      </div>
    </div>
  </main>

  <script>
    function showView(name) {
      document.getElementById('view-confirm').classList.toggle('hidden', name !== 'confirm');
      document.getElementById('view-signed-out').classList.toggle('hidden', name !== 'signed-out');
    }

    function triggerLogout() {
      showView('signed-out');
      // Nav: hide user info after logout
      document.getElementById('nav-authed').innerHTML = '<a href="login.html" class="text-blue-600 font-medium hover:text-blue-700 transition-colors text-sm">Sign in</a>';
    }
  </script>
</body>
</html>
