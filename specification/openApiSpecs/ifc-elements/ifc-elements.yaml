  /ifc/files/{fileId}/elements/{globalId}/property-sets/validate:
    parameters:
      - $ref: '../schemas/common.yaml#/FileIdParam'
      - $ref: '../schemas/common.yaml#/GlobalIdParam'

    post:
      operationId: validateAllPropertySets
      summary: Validate all property sets on an element
      description: |
        Validates all property sets on the element against their standard
        definitions. Returns validation results for each property set.

        **Required scope:** `ifc:read`
      tags:
        - IFC Elements
      responses:
        '200':
          description: Validation results
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      results:
                        type: array
                        items:
                          type: object
                          properties:
                            psetName:
                              type: string
                            valid:
                              type: boolean
                            errors:
                              type: array
                              items:
                                type: string
                          required:
                            - psetName
                            - valid
                    required:
                      - results
                required:
                  - data
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'

  /ifc/files/{fileId}/elements/{globalId}/property-sets/{psetName}/validate:
    parameters:
      - $ref: '../schemas/common.yaml#/FileIdParam'
      - $ref: '../schemas/common.yaml#/GlobalIdParam'
      - name: psetName
        in: path
        required: true
        description: Property set name
        schema:
          type: string

    post:
      operationId: validatePropertySet
      summary: Validate a single property set
      description: |
        Validates a specific property set against its standard definition
        or a custom template provided in the request body.

        **Required scope:** `ifc:read`
      tags:
        - IFC Elements
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                template:
                  type: object
                  description: Custom validation template (uses standard schema if omitted)
                  properties:
                    properties:
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                          type:
                            type: string
                          required:
                            type: boolean
                        required:
                          - name
                          - type
                  required:
                    - properties
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                required:
                  - data
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'
