paths:
  /ifc/files/{fileId}/elements:
    parameters:
      - $ref: '../schemas/common.yaml#/FileIdParam'

    get:
      operationId: listElements
      summary: List building elements
      description: |
        Returns building elements in the IFC file with optional filtering
        and pagination. Supports filtering by storey, type, category, name,
        property values, and bounding box.

        **Required scope:** `ifc:read`
      tags:
        - IFC Elements
      parameters:
        - name: storeyId
          in: query
          description: Filter by storey GlobalId
          schema:
            type: string
        - name: type
          in: query
          description: Filter by IFC type name (e.g. IfcWall, IfcSlab)
          schema:
            type: string
        - name: category
          in: query
          description: Filter by category (e.g. "MEP")
          schema:
            type: string
        - name: name
          in: query
          description: Filter by element name (partial match)
          schema:
            type: string
        - name: pset
          in: query
          description: Filter by property set name
          schema:
            type: string
        - name: property
          in: query
          description: Filter by property name (use with pset and value)
          schema:
            type: string
        - name: value
          in: query
          description: Filter by property value
          schema:
            type: string
        - name: bbox
          in: query
          description: Bounding box filter (format depends on implementation)
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum number of elements to return
          schema:
            type: integer
            minimum: 1
        - name: offset
          in: query
          description: Number of elements to skip
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: Element list retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      elements:
                        type: array
                        items:
                          $ref: '../schemas/ifc.yaml#/IfcElement'
                      total:
                        type: integer
                        description: Total number of matching elements
                      limit:
                        type: integer
                        description: Applied limit (if provided)
                      offset:
                        type: integer
                        description: Applied offset (if provided)
                    required:
                      - elements
                      - total
                required:
                  - data
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'

    post:
      operationId: createElement
      summary: Create a building element
      description: |
        Creates a new building element in the IFC model. Increments the
        model version. The element is assigned a generated GlobalId.

        **Required scope:** `ifc:write`
      tags:
        - IFC Elements
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ifcType:
                  type: string
                  description: IFC entity type (defaults to "IfcBuildingElement")
                  example: "IfcWall"
                name:
                  type: string
                  description: Element name
                  example: "Exterior Wall A"
                description:
                  type: string
                  description: Element description
                predefinedType:
                  type: string
                  description: Predefined type qualifier
                  example: "STANDARD"
                storeyGlobalId:
                  type: string
                  description: GlobalId of the containing storey
                hostGlobalId:
                  type: string
                  description: GlobalId of the host element
      responses:
        '201':
          description: Element created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '../schemas/ifc.yaml#/IfcElementWithVersion'
                required:
                  - data
        '400':
          $ref: '../schemas/common.yaml#/ValidationError'
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'

  /ifc/files/{fileId}/elements/summary:
    parameters:
      - $ref: '../schemas/common.yaml#/FileIdParam'

    get:
      operationId: getElementSummary
      summary: Get element summary grouped by category
      description: |
        Returns a summary of elements grouped by the specified field.
        Supported groupBy values: "ifcType", "storey", "host", "category".

        **Required scope:** `ifc:read`
      tags:
        - IFC Elements
      parameters:
        - name: groupBy
          in: query
          description: Field to group by (default "ifcType")
          schema:
            type: string
            enum:
              - ifcType
              - storey
              - host
              - category
            default: ifcType
      responses:
        '200':
          description: Summary retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      groups:
                        type: array
                        items:
                          type: object
                          properties:
                            key:
                              type: string
                              description: Group key value
                              example: "IfcWall"
                            count:
                              type: integer
                              description: Number of elements in this group
                              example: 12
                            items:
                              type: array
                              items:
                                type: string
                              description: GlobalIds of elements in this group
                          required:
                            - key
                            - count
                    required:
                      - groups
                required:
                  - data
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '422':
          $ref: '../schemas/common.yaml#/UnprocessableEntityError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'

  /ifc/files/{fileId}/elements/{globalId}:
    parameters:
      - $ref: '../schemas/common.yaml#/FileIdParam'
      - $ref: '../schemas/common.yaml#/GlobalIdParam'

    get:
      operationId: getElement
      summary: Get a single element
      description: |
        Returns full details of a single building element.

        **Required scope:** `ifc:read`
      tags:
        - IFC Elements
      responses:
        '200':
          description: Element retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '../schemas/ifc.yaml#/IfcElement'
                required:
                  - data
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'

    patch:
      operationId: updateElement
      summary: Update an element
      description: |
        Partially updates an element's name and/or description.
        Increments the model version.

        **Required scope:** `ifc:write`
      tags:
        - IFC Elements
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: New element name
                description:
                  type: string
                  description: New element description
      responses:
        '200':
          description: Element updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '../schemas/ifc.yaml#/IfcElementWithVersion'
                required:
                  - data
        '400':
          $ref: '../schemas/common.yaml#/ValidationError'
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'

    delete:
      operationId: deleteElement
      summary: Delete an element
      description: |
        Removes a building element from the model. Increments the model
        version. Returns the new version number in the `X-IFC-Version` header.

        **Required scope:** `ifc:delete`
      tags:
        - IFC Elements
      responses:
        '204':
          description: Element deleted
          headers:
            X-IFC-Version:
              description: New IFC model version after deletion
              schema:
                type: integer
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'

  # --- Element Geometry ---

  /ifc/files/{fileId}/elements/{globalId}/geometry:
    parameters:
      - $ref: '../schemas/common.yaml#/FileIdParam'
      - $ref: '../schemas/common.yaml#/GlobalIdParam'

    get:
      operationId: getElementGeometry
      summary: Get element geometry
      description: |
        Returns the geometric representation of an element.

        **Required scope:** `ifc:read`
      tags:
        - IFC Elements
      responses:
        '200':
          description: Geometry retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '../schemas/ifc.yaml#/IfcGeometryRepresentation'
                required:
                  - data
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'

  # --- Element Placement ---

  /ifc/files/{fileId}/elements/{globalId}/placement:
    parameters:
      - $ref: '../schemas/common.yaml#/FileIdParam'
      - $ref: '../schemas/common.yaml#/GlobalIdParam'

    get:
      operationId: getElementPlacement
      summary: Get element placement
      description: |
        Returns the placement (position and orientation) of an element
        in 3D space.

        **Required scope:** `ifc:read`
      tags:
        - IFC Elements
      responses:
        '200':
          description: Placement retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '../schemas/ifc.yaml#/IfcPlacement'
                required:
                  - data
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'

    patch:
      operationId: updateElementPlacement
      summary: Update element placement
      description: |
        Updates the position and/or orientation of an element.

        **Required scope:** `ifc:write`
      tags:
        - IFC Elements
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                location:
                  $ref: '../schemas/ifc.yaml#/IfcPoint3D'
                direction:
                  $ref: '../schemas/ifc.yaml#/IfcPoint3D'
      responses:
        '200':
          description: Placement updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '../schemas/ifc.yaml#/IfcPlacement'
                required:
                  - data
        '400':
          $ref: '../schemas/common.yaml#/ValidationError'
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '422':
          $ref: '../schemas/common.yaml#/UnprocessableEntityError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'

  # --- Element Type ---

  /ifc/files/{fileId}/elements/{globalId}/type:
    parameters:
      - $ref: '../schemas/common.yaml#/FileIdParam'
      - $ref: '../schemas/common.yaml#/GlobalIdParam'

    get:
      operationId: getElementType
      summary: Get element type definition
      description: |
        Returns the type definition assigned to an element.

        **Required scope:** `ifc:read`
      tags:
        - IFC Elements
      responses:
        '200':
          description: Type definition retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '../schemas/ifc.yaml#/IfcTypeDefinition'
                required:
                  - data
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'

    put:
      operationId: setElementType
      summary: Set element type definition
      description: |
        Assigns or replaces the type definition for an element.

        **Required scope:** `ifc:write`
      tags:
        - IFC Elements
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/ifc.yaml#/IfcTypeDefinition'
      responses:
        '200':
          description: Type definition set
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '../schemas/ifc.yaml#/IfcTypeDefinition'
                required:
                  - data
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '422':
          $ref: '../schemas/common.yaml#/UnprocessableEntityError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'

  # --- Spatial Containment ---

  /ifc/files/{fileId}/elements/{globalId}/spatial-containment:
    parameters:
      - $ref: '../schemas/common.yaml#/FileIdParam'
      - $ref: '../schemas/common.yaml#/GlobalIdParam'

    get:
      operationId: getElementSpatialContainment
      summary: Get element spatial containment
      description: |
        Returns the spatial containment relationship — which storey
        contains this element.

        **Required scope:** `ifc:read`
      tags:
        - IFC Elements
      responses:
        '200':
          description: Spatial containment retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '../schemas/ifc.yaml#/IfcSpatialContainment'
                required:
                  - data
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'

    put:
      operationId: setElementSpatialContainment
      summary: Set element spatial containment
      description: |
        Moves an element to a different storey by setting its spatial
        containment relationship.

        **Required scope:** `ifc:write`
      tags:
        - IFC Elements
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                storeyGlobalId:
                  type: string
                  description: GlobalId of the target storey
              required:
                - storeyGlobalId
      responses:
        '200':
          description: Spatial containment updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '../schemas/ifc.yaml#/IfcSpatialContainment'
                required:
                  - data
        '400':
          $ref: '../schemas/common.yaml#/ValidationError'
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '422':
          $ref: '../schemas/common.yaml#/UnprocessableEntityError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'

  # --- Property Sets ---

  /ifc/files/{fileId}/elements/{globalId}/property-sets:
    parameters:
      - $ref: '../schemas/common.yaml#/FileIdParam'
      - $ref: '../schemas/common.yaml#/GlobalIdParam'

    get:
      operationId: listPropertySets
      summary: List element property sets
      description: |
        Returns all property sets attached to an element.

        **Required scope:** `ifc:read`
      tags:
        - IFC Elements
      responses:
        '200':
          description: Property sets retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      propertySets:
                        type: array
                        items:
                          $ref: '../schemas/ifc.yaml#/IfcPropertySet'
                    required:
                      - propertySets
                required:
                  - data
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'

    post:
      operationId: createPropertySet
      summary: Create a property set
      description: |
        Creates a new property set on an element with optional initial properties.

        **Required scope:** `ifc:write`
      tags:
        - IFC Elements
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Property set name
                  example: "Pset_WallCommon"
                properties:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        example: "IsExternal"
                      type:
                        type: string
                        example: "boolean"
                      value:
                        description: Property value
                        example: true
                    required:
                      - name
                      - type
                      - value
      responses:
        '201':
          description: Property set created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '../schemas/ifc.yaml#/IfcPropertySet'
                required:
                  - data
        '400':
          $ref: '../schemas/common.yaml#/ValidationError'
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'

  /ifc/files/{fileId}/elements/{globalId}/property-sets/{psetName}:
    parameters:
      - $ref: '../schemas/common.yaml#/FileIdParam'
      - $ref: '../schemas/common.yaml#/GlobalIdParam'
      - name: psetName
        in: path
        required: true
        description: Property set name
        schema:
          type: string
          example: "Pset_WallCommon"

    get:
      operationId: getPropertySet
      summary: Get a single property set
      description: |
        Returns a property set by name with all its properties.

        **Required scope:** `ifc:read`
      tags:
        - IFC Elements
      responses:
        '200':
          description: Property set retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '../schemas/ifc.yaml#/IfcPropertySet'
                required:
                  - data
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'

  /ifc/files/{fileId}/elements/{globalId}/property-sets/{psetName}/properties:
    parameters:
      - $ref: '../schemas/common.yaml#/FileIdParam'
      - $ref: '../schemas/common.yaml#/GlobalIdParam'
      - name: psetName
        in: path
        required: true
        description: Property set name
        schema:
          type: string

    get:
      operationId: listProperties
      summary: List properties in a property set
      description: |
        Returns all properties within a specific property set.

        **Required scope:** `ifc:read`
      tags:
        - IFC Elements
      responses:
        '200':
          description: Properties retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '../schemas/ifc.yaml#/IfcProperty'
                required:
                  - data
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'

    post:
      operationId: createProperty
      summary: Add a property to a property set
      description: |
        Creates a new property within an existing property set.

        **Required scope:** `ifc:write`
      tags:
        - IFC Elements
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Property name
                  example: "FireRating"
                type:
                  type: string
                  description: Property value type
                  example: "string"
                value:
                  description: Property value
                  example: "2HR"
              required:
                - name
                - type
                - value
      responses:
        '201':
          description: Property created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '../schemas/ifc.yaml#/IfcProperty'
                required:
                  - data
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '422':
          $ref: '../schemas/common.yaml#/UnprocessableEntityError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'

  /ifc/files/{fileId}/elements/{globalId}/property-sets/{psetName}/properties/{propertyName}:
    parameters:
      - $ref: '../schemas/common.yaml#/FileIdParam'
      - $ref: '../schemas/common.yaml#/GlobalIdParam'
      - name: psetName
        in: path
        required: true
        description: Property set name
        schema:
          type: string
      - name: propertyName
        in: path
        required: true
        description: Property name
        schema:
          type: string

    get:
      operationId: getProperty
      summary: Get a single property
      description: |
        Returns a specific property by name within a property set.

        **Required scope:** `ifc:read`
      tags:
        - IFC Elements
      responses:
        '200':
          description: Property retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '../schemas/ifc.yaml#/IfcProperty'
                required:
                  - data
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'

    patch:
      operationId: updateProperty
      summary: Update a property
      description: |
        Updates the type and/or value of an existing property.

        **Required scope:** `ifc:write`
      tags:
        - IFC Elements
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  description: New property value type
                value:
                  description: New property value
      responses:
        '200':
          description: Property updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '../schemas/ifc.yaml#/IfcProperty'
                required:
                  - data
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '422':
          $ref: '../schemas/common.yaml#/UnprocessableEntityError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'

    delete:
      operationId: deleteProperty
      summary: Delete a property
      description: |
        Removes a property from a property set.

        **Required scope:** `ifc:delete`
      tags:
        - IFC Elements
      responses:
        '204':
          description: Property deleted
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'

  # --- Quantity Sets ---

  /ifc/files/{fileId}/elements/{globalId}/quantity-sets:
    parameters:
      - $ref: '../schemas/common.yaml#/FileIdParam'
      - $ref: '../schemas/common.yaml#/GlobalIdParam'

    get:
      operationId: listQuantitySets
      summary: List element quantity sets
      description: |
        Returns all quantity sets attached to an element.

        **Required scope:** `ifc:read`
      tags:
        - IFC Elements
      responses:
        '200':
          description: Quantity sets retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      quantitySets:
                        type: array
