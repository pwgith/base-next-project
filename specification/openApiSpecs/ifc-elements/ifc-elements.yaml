  # --- Element Classifications ---

  /ifc/files/{fileId}/elements/{globalId}/classifications:
    parameters:
      - $ref: '../schemas/common.yaml#/FileIdParam'
      - $ref: '../schemas/common.yaml#/GlobalIdParam'

    get:
      operationId: listElementClassifications
      summary: List element classifications
      description: |
        Returns all classification references applied to an element.

        **Required scope:** `ifc:read`
      tags:
        - IFC Elements
      responses:
        '200':
          description: Classifications retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      classifications:
                        type: array
                        items:
                          $ref: '../schemas/ifc.yaml#/IfcClassificationReference'
                    required:
                      - classifications
                required:
                  - data
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'

    post:
      operationId: addElementClassification
      summary: Add a classification reference
      description: |
        Adds a classification reference to an element, creating the
        classification system if it does not already exist.

        **Required scope:** `ifc:write`
      tags:
        - IFC Elements
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                systemName:
                  type: string
                  description: Classification system name
                  example: "Uniclass 2015"
                itemReference:
                  type: string
                  description: Classification item reference code
                  example: "Ss_25_10_30"
                notation:
                  type: string
                  description: Classification notation
              required:
                - systemName
      responses:
        '201':
          description: Classification reference added
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '../schemas/ifc.yaml#/IfcClassificationReference'
                required:
                  - data
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '422':
          $ref: '../schemas/common.yaml#/UnprocessableEntityError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'

  /ifc/files/{fileId}/elements/{globalId}/classifications/{referenceId}:
    parameters:
      - $ref: '../schemas/common.yaml#/FileIdParam'
      - $ref: '../schemas/common.yaml#/GlobalIdParam'
      - name: referenceId
        in: path
        required: true
        description: Classification reference GlobalId
        schema:
          type: string

    patch:
      operationId: updateElementClassification
      summary: Update a classification reference
      description: |
        Updates the item reference or notation of a classification reference.

        **Required scope:** `ifc:write`
      tags:
        - IFC Elements
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                itemReference:
                  type: string
                notation:
                  type: string
      responses:
        '200':
          description: Classification reference updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '../schemas/ifc.yaml#/IfcClassificationReference'
                required:
                  - data
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '422':
          $ref: '../schemas/common.yaml#/UnprocessableEntityError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'

    delete:
      operationId: deleteElementClassification
      summary: Remove a classification reference
      description: |
        Removes a classification reference from an element.

        **Required scope:** `ifc:delete`
      tags:
        - IFC Elements
      responses:
        '204':
          description: Classification reference removed
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'

  # --- Element Material ---

  /ifc/files/{fileId}/elements/{globalId}/material:
    parameters:
      - $ref: '../schemas/common.yaml#/FileIdParam'
      - $ref: '../schemas/common.yaml#/GlobalIdParam'

    get:
      operationId: getElementMaterial
      summary: Get element material assignment
      description: |
        Returns the material assigned to an element, including layer
        information if applicable.

        **Required scope:** `ifc:read`
      tags:
        - IFC Elements
      responses:
        '200':
          description: Material assignment retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '../schemas/ifc.yaml#/IfcMaterialAssignment'
                required:
                  - data
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'

    put:
      operationId: setElementMaterial
      summary: Assign material to element
      description: |
        Assigns or replaces the material for an element.

        **Required scope:** `ifc:write`
      tags:
        - IFC Elements
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                materialGlobalId:
                  type: string
                  description: GlobalId of the material to assign
                role:
                  type: string
                  description: Material role (e.g. "LoadBearing")
              required:
                - materialGlobalId
      responses:
        '200':
          description: Material assigned
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '../schemas/ifc.yaml#/IfcMaterialAssignment'
                required:
                  - data
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '422':
          $ref: '../schemas/common.yaml#/UnprocessableEntityError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'

    delete:
      operationId: removeElementMaterial
      summary: Remove material from element
      description: |
        Removes the material assignment from an element.

        **Required scope:** `ifc:delete`
      tags:
        - IFC Elements
      responses:
        '204':
          description: Material assignment removed
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'

  # --- Material Layers ---

  /ifc/files/{fileId}/elements/{globalId}/material/layers/{layerIndex}:
    parameters:
      - $ref: '../schemas/common.yaml#/FileIdParam'
      - $ref: '../schemas/common.yaml#/GlobalIdParam'
      - name: layerIndex
        in: path
        required: true
        description: Zero-based layer index
        schema:
          type: integer
          minimum: 0

    get:
      operationId: getMaterialLayer
      summary: Get a material layer
      description: |
        Returns a specific layer within a layered material by index.

        **Required scope:** `ifc:read`
      tags:
        - IFC Elements
      responses:
        '200':
          description: Layer retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '../schemas/ifc.yaml#/IfcMaterialLayer'
                required:
                  - data
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'

    patch:
      operationId: updateMaterialLayer
      summary: Update a material layer
      description: |
        Updates properties of a specific material layer.

        **Required scope:** `ifc:write`
      tags:
        - IFC Elements
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                thickness:
                  type: number
                isVentilated:
                  type: boolean
      responses:
        '200':
          description: Layer updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '../schemas/ifc.yaml#/IfcMaterialLayer'
                required:
                  - data
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '422':
          $ref: '../schemas/common.yaml#/UnprocessableEntityError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'

  /ifc/files/{fileId}/elements/{globalId}/material/constituents/{index}:
    parameters:
      - $ref: '../schemas/common.yaml#/FileIdParam'
      - $ref: '../schemas/common.yaml#/GlobalIdParam'
      - name: index
        in: path
        required: true
        description: Zero-based constituent index
        schema:
          type: integer
          minimum: 0

    patch:
      operationId: updateMaterialConstituent
      summary: Update a material constituent
      description: |
        Updates a constituent within a material constituent set by its
        zero-based index.

        **Required scope:** `ifc:write`
      tags:
        - IFC Elements
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                materialName:
                  type: string
                name:
                  type: string
                fraction:
                  type: number
                category:
                  type: string
      responses:
        '200':
          description: Constituent updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      constituent:
                        $ref: '../schemas/ifc.yaml#/IfcMaterialConstituent'
                    required:
                      - constituent
                required:
                  - data
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'

    delete:
      operationId: deleteMaterialConstituent
      summary: Delete a material constituent
      description: |
        Removes a constituent from the material constituent set by its
        zero-based index.

        **Required scope:** `ifc:delete`
      tags:
        - IFC Elements
      responses:
        '200':
          description: Constituent deleted, updated assignment returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      assignment:
                        $ref: '../schemas/ifc.yaml#/IfcMaterialAssignment'
                    required:
                      - assignment
                required:
                  - data
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'

  /ifc/files/{fileId}/elements/{globalId}/openings:
    parameters:
      - $ref: '../schemas/common.yaml#/FileIdParam'
      - $ref: '../schemas/common.yaml#/GlobalIdParam'

    get:
      operationId: listElementOpenings
      summary: List openings in an element
      description: |
        Returns all openings (voids) in the specified element.

        **Required scope:** `ifc:read`
      tags:
        - IFC Elements
      responses:
        '200':
          description: Openings retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      openings:
                        type: array
                        items:
                          $ref: '../schemas/ifc.yaml#/IfcOpeningElement'
                    required:
                      - openings
                required:
                  - data
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'

    post:
      operationId: createElementOpening
      summary: Create an opening in an element
      description: |
        Creates a new opening (void) in the specified element. Increments
        the model version.

        **Required scope:** `ifc:write`
      tags:
        - IFC Elements
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Opening name
                  example: "Door Opening 1"
                placement:
                  type: object
                  properties:
                    x:
                      type: number
                    y:
                      type: number
                    z:
                      type: number
                  required:
                    - x
                    - y
                    - z
                dimensions:
                  type: object
                  properties:
                    width:
                      type: number
                    height:
                      type: number
                  required:
                    - width
                    - height
              required:
                - name
                - placement
                - dimensions
      responses:
        '201':
          description: Opening created
          headers:
            X-IFC-Version:
              schema:
                type: integer
              description: New model version number
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '../schemas/ifc.yaml#/IfcOpeningElementWithVersion'
                required:
                  - data
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'

  /ifc/files/{fileId}/elements/{globalId}/openings/{openingId}:
    parameters:
      - $ref: '../schemas/common.yaml#/FileIdParam'
      - $ref: '../schemas/common.yaml#/GlobalIdParam'
      - name: openingId
        in: path
        required: true
        description: Opening GlobalId
        schema:
          type: string

    delete:
      operationId: deleteElementOpening
      summary: Delete an opening
      description: |
        Removes an opening (and any filling) from the host element.
        Increments the model version.

        **Required scope:** `ifc:delete`
      tags:
        - IFC Elements
      responses:
        '204':
          description: Opening deleted
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'

  /ifc/files/{fileId}/elements/{globalId}/openings/{openingId}/filling:
    parameters:
      - $ref: '../schemas/common.yaml#/FileIdParam'
      - $ref: '../schemas/common.yaml#/GlobalIdParam'
      - name: openingId
        in: path
        required: true
        description: Opening GlobalId
        schema:
          type: string

    get:
      operationId: getOpeningFilling
      summary: Get opening filling element
      description: |
        Returns the element that fills the specified opening (e.g. a door
        or window). Returns 404 if no filling is assigned.

        **Required scope:** `ifc:read`
      tags:
        - IFC Elements
      responses:
        '200':
          description: Filling retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                required:
                  - data
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'

    put:
      operationId: setOpeningFilling
      summary: Set filling element for an opening
      description: |
        Assigns an element (e.g. a door or window) as the filling for
        the specified opening. Increments the model version.

        **Required scope:** `ifc:write`
      tags:
        - IFC Elements
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fillingGlobalId:
                  type: string
                  description: GlobalId of the element to use as filling
              required:
                - fillingGlobalId
      responses:
        '200':
          description: Filling set
          headers:
            X-IFC-Version:
              schema:
                type: integer
              description: New model version number
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      fillingElement:
                        type: object
                    required:
                      - fillingElement
                required:
                  - data
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '409':
          $ref: '../schemas/common.yaml#/ConflictError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'

    delete:
      operationId: removeOpeningFilling
      summary: Remove filling from an opening
      description: |
        Removes the filling element assignment from the opening. The filling
        element itself is not deleted. Increments the model version.

        **Required scope:** `ifc:delete`
      tags:
        - IFC Elements
      responses:
        '204':
          description: Filling removed
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'

  /ifc/files/{fileId}/elements/{globalId}/ports:
    parameters:
      - $ref: '../schemas/common.yaml#/FileIdParam'
      - $ref: '../schemas/common.yaml#/GlobalIdParam'

    get:
      operationId: listElementPorts
      summary: List distribution ports on an element
      description: |
        Returns all distribution ports attached to the specified element.

        **Required scope:** `ifc:read`
      tags:
        - IFC Elements
      responses:
        '200':
          description: Ports retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      ports:
                        type: array
                        items:
                          $ref: '../schemas/ifc.yaml#/IfcDistributionPort'
                    required:
                      - ports
                required:
                  - data
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'

    post:
      operationId: createElementPort
      summary: Create a distribution port on an element
      description: |
        Creates a new distribution port on the specified element. Increments
        the model version.

        **Required scope:** `ifc:write`
      tags:
        - IFC Elements
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Port name
                  example: "Inlet Port"
                flowDirection:
                  type: string
                  description: Flow direction (SOURCE, SINK, SOURCEANDSINK, NOTDEFINED)
                  example: "SOURCE"
                systemType:
                  type: string
                  description: System type (e.g. VENTILATION, DRAINAGE)
              required:
                - name
                - flowDirection
      responses:
        '201':
          description: Port created
          headers:
            X-IFC-Version:
              schema:
                type: integer
              description: New model version number
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '../schemas/ifc.yaml#/IfcDistributionPortWithVersion'
                required:
                  - data
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'

  /ifc/files/{fileId}/elements/{globalId}/connections:
    parameters:
      - $ref: '../schemas/common.yaml#/FileIdParam'
      - $ref: '../schemas/common.yaml#/GlobalIdParam'

    get:
      operationId: listElementConnections
      summary: List connections for an element
      description: |
        Returns all port connections involving the specified element.

        **Required scope:** `ifc:read`
      tags:
        - IFC Elements
      responses:
        '200':
          description: Connections retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      connections:
                        type: array
                        items:
                          $ref: '../schemas/ifc.yaml#/IfcPortConnection'
                    required:
                      - connections
                required:
                  - data
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'

    post:
      operationId: createElementConnection
      summary: Create a connection between elements
      description: |
        Creates a new port connection between two elements. Increments
        the model version.

        **Required scope:** `ifc:write`
      tags:
        - IFC Elements
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                relatedElementGlobalId:
                  type: string
                  description: GlobalId of the target element
                sourcePortId:
                  type: string
                  description: Port identifier on the source element
                targetPortId:
                  type: string
                  description: Port identifier on the target element
              required:
                - relatedElementGlobalId
      responses:
        '201':
          description: Connection created
          headers:
            X-IFC-Version:
              schema:
                type: integer
              description: New model version number
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '../schemas/ifc.yaml#/IfcPortConnectionWithVersion'
                required:
                  - data
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'

  /ifc/files/{fileId}/elements/{globalId}/connections/{connectionId}:
    parameters:
      - $ref: '../schemas/common.yaml#/FileIdParam'
      - $ref: '../schemas/common.yaml#/GlobalIdParam'
      - name: connectionId
        in: path
        required: true
        description: Connection identifier
        schema:
          type: string

    delete:
      operationId: deleteElementConnection
      summary: Delete a connection
      description: |
