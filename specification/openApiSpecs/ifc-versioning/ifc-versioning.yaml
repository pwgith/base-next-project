paths:
  /ifc/files/{fileId}/versions:
    parameters:
      - $ref: '../schemas/common.yaml#/FileIdParam'

    get:
      operationId: listVersions
      summary: List version history
      description: |
        Returns all versions of the IFC model, ordered newest to oldest.
        Each entry includes the version number, timestamp, author, and
        a description of the changes.

        **Required scope:** `ifc:read`
      tags:
        - IFC Versioning
      responses:
        '200':
          description: Version list retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      versions:
                        type: array
                        items:
                          $ref: '../schemas/ifc.yaml#/VersionMetadata'
                    required:
                      - versions
                required:
                  - data
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'

  /ifc/files/{fileId}/versions/{version}:
    parameters:
      - $ref: '../schemas/common.yaml#/FileIdParam'
      - name: version
        in: path
        required: true
        description: Version number (positive integer)
        schema:
          type: integer
          minimum: 1
          example: 3

    get:
      operationId: getVersionMetadata
      summary: Get version metadata
      description: |
        Returns metadata for a specific version including the timestamp,
        author, and change description.

        **Required scope:** `ifc:read`
      tags:
        - IFC Versioning
      responses:
        '200':
          description: Version metadata retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '../schemas/ifc.yaml#/VersionMetadata'
                required:
                  - data
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'

  /ifc/files/{fileId}/versions/{version}/download:
    parameters:
      - $ref: '../schemas/common.yaml#/FileIdParam'
      - name: version
        in: path
        required: true
        description: Version number to download
        schema:
          type: integer
          minimum: 1

    get:
      operationId: downloadVersion
      summary: Download a version as IFC STEP file
      description: |
        Downloads the IFC model at a specific version as a STEP file.
        The filename is derived from the project name and version number.

        **Required scope:** `ifc:read`
      tags:
        - IFC Versioning
      responses:
        '200':
          description: IFC STEP file at the requested version
          headers:
            Content-Disposition:
              description: Attachment filename
              schema:
                type: string
                example: 'attachment; filename="MyProject_v3.ifc"'
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'

  /ifc/files/{fileId}/versions/{version}/restore:
    parameters:
      - $ref: '../schemas/common.yaml#/FileIdParam'
      - name: version
        in: path
        required: true
        description: Version number to restore
        schema:
          type: integer
          minimum: 1

    post:
      operationId: restoreVersion
      summary: Restore a previous version
      description: |
        Restores the IFC model to a previous version. This creates a new
        version (does not overwrite history). The model data is copied from
        the specified version and saved as the next version number.

        **Required scope:** `ifc:write`
      tags:
        - IFC Versioning
      requestBody:
        description: No request body required
        content: {}
      responses:
        '201':
          description: Version restored (new version created)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      versionNumber:
                        type: integer
                        description: The restored version number
                        example: 2
                      createdAt:
                        type: string
                        format: date-time
                      changeDescription:
                        type: string
                        description: Auto-generated restore description
                        example: "Restored from version 2"
                      version:
                        type: integer
                        description: The new version number after restore
                        example: 5
                    required:
                      - versionNumber
                      - createdAt
                      - version
                required:
                  - data
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'
