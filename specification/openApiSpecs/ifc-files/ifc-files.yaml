paths:
  /ifc/files:
    get:
      operationId: listFiles
      summary: List all IFC files
      description: |
        Returns all IFC files owned by the authenticated user.

        **Required scope:** `ifc:read`
      tags:
        - IFC Files
      responses:
        '200':
          description: File list retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      files:
                        type: array
                        items:
                          $ref: '#/components/schemas/IfcFile'
                    required:
                      - files
                required:
                  - data
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'

    post:
      operationId: uploadFile
      summary: Upload an IFC file
      description: |
        Uploads an IFC STEP file. Accepts either multipart form-data with a
        binary `.ifc` file, or a JSON body with `fileName` and `content`.
        Creates a new project and parses the IFC model into the database.

        **Required scope:** `ifc:write`
      tags:
        - IFC Files
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: IFC STEP file (must have .ifc extension)
              required:
                - file
          application/json:
            schema:
              type: object
              properties:
                fileName:
                  type: string
                  description: File name (must end with .ifc)
                  example: "building.ifc"
                content:
                  type: string
                  description: IFC STEP file content (must start with "ISO-10303-21;")
              required:
                - fileName
                - content
      responses:
        '201':
          description: File uploaded and parsed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/IfcFileCreated'
                required:
                  - data
        '400':
          $ref: '../schemas/common.yaml#/ValidationError'
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'

  /ifc/files/{fileId}:
    parameters:
      - $ref: '../schemas/common.yaml#/FileIdParam'

    get:
      operationId: getFile
      summary: Get IFC file metadata
      description: |
        Returns metadata for a single IFC file including element count
        and current version.

        **Required scope:** `ifc:read`
      tags:
        - IFC Files
      responses:
        '200':
          description: File metadata retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/IfcFile'
                required:
                  - data
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'

    delete:
      operationId: deleteFile
      summary: Delete an IFC file
      description: |
        Permanently deletes an IFC file and all associated model data,
        versions, and the parent project.

        **Required scope:** `ifc:delete`
      tags:
        - IFC Files
      responses:
        '204':
          description: File deleted
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'

components:
  schemas:
    IfcFile:
      type: object
      description: IFC file with metadata
      properties:
        fileId:
          type: string
          format: uuid
          description: Unique file identifier (same as project ID)
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        name:
          type: string
          description: File name
          example: "building.ifc"
        schema:
          type: string
          description: IFC schema version
          example: "IFC4"
        createdAt:
          type: string
          format: date-time
          description: Upload timestamp
        elementCount:
          type: integer
          description: Number of building elements in the model
          example: 42
        currentVersion:
          type: integer
          description: Current IFC model version number
          example: 3
      required:
        - fileId
        - name
        - schema
        - createdAt
        - elementCount
        - currentVersion

    IfcFileCreated:
      type: object
      description: Response after successful file upload
      properties:
        fileId:
          type: string
          format: uuid
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        name:
          type: string
          example: "building.ifc"
        schema:
          type: string
          example: "IFC4"
        version:
          type: integer
          description: Initial version (always 1)
          example: 1
      required:
        - fileId
        - name
        - schema
        - version
