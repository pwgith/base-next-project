paths:
  /ifc/files/{fileId}/groups:
    parameters:
      - $ref: '../schemas/common.yaml#/FileIdParam'

    post:
      operationId: createGroup
      summary: Create an element group
      description: |
        Creates a new named group of elements. Members can be specified
        at creation time or added individually later.

        **Required scope:** `ifc:write`
      tags:
        - IFC Groups
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Group name
                  example: "Fire Safety Zone A"
                description:
                  type: string
                  description: Group description
                members:
                  type: array
                  items:
                    type: string
                  description: GlobalIds of initial member elements
              required:
                - name
      responses:
        '201':
          description: Group created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '../schemas/ifc.yaml#/IfcGroup'
                required:
                  - data
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '422':
          $ref: '../schemas/common.yaml#/UnprocessableEntityError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'

  /ifc/files/{fileId}/groups/{groupGlobalId}:
    parameters:
      - $ref: '../schemas/common.yaml#/FileIdParam'
      - name: groupGlobalId
        in: path
        required: true
        description: Group GlobalId
        schema:
          type: string

    get:
      operationId: getGroup
      summary: Get a group
      description: |
        Returns a group with its name, description, and member list.

        **Required scope:** `ifc:read`
      tags:
        - IFC Groups
      responses:
        '200':
          description: Group retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '../schemas/ifc.yaml#/IfcGroup'
                required:
                  - data
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'

  /ifc/files/{fileId}/groups/{groupGlobalId}/members:
    parameters:
      - $ref: '../schemas/common.yaml#/FileIdParam'
      - name: groupGlobalId
        in: path
        required: true
        description: Group GlobalId
        schema:
          type: string

    get:
      operationId: listGroupMembers
      summary: List group members
      description: |
        Returns all member elements of a group.

        **Required scope:** `ifc:read`
      tags:
        - IFC Groups
      responses:
        '200':
          description: Members retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        globalId:
                          type: string
                          description: Member element GlobalId
                required:
                  - data
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'

    post:
      operationId: addGroupMember
      summary: Add a member to a group
      description: |
        Adds an element to a group by its GlobalId.

        **Required scope:** `ifc:write`
      tags:
        - IFC Groups
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                memberGlobalId:
                  type: string
                  description: GlobalId of the element to add
              required:
                - memberGlobalId
      responses:
        '201':
          description: Member added
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      globalId:
                        type: string
                        description: Group GlobalId
                      memberGlobalId:
                        type: string
                        description: Added member GlobalId
                    required:
                      - globalId
                      - memberGlobalId
                required:
                  - data
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'

  /ifc/files/{fileId}/groups/{groupGlobalId}/members/{memberGlobalId}:
    parameters:
      - $ref: '../schemas/common.yaml#/FileIdParam'
      - name: groupGlobalId
        in: path
        required: true
        description: Group GlobalId
        schema:
          type: string
      - name: memberGlobalId
        in: path
        required: true
        description: Member element GlobalId
        schema:
          type: string

    get:
      operationId: getGroupMember
      summary: Get a group member
      description: |
        Returns details of a specific member within a group.

        **Required scope:** `ifc:read`
      tags:
        - IFC Groups
      responses:
        '200':
          description: Member retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      globalId:
                        type: string
                      memberGlobalId:
                        type: string
                    required:
                      - globalId
                      - memberGlobalId
                required:
                  - data
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'

    delete:
      operationId: removeGroupMember
      summary: Remove a member from a group
      description: |
        Removes an element from a group.

        **Required scope:** `ifc:delete`
      tags:
        - IFC Groups
      responses:
        '204':
          description: Member removed
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'
