paths:
  /ifc/files/{fileId}/project:
    parameters:
      - $ref: '../schemas/common.yaml#/FileIdParam'

    get:
      operationId: getIfcProjectEntity
      summary: Get IFC project entity
      description: |
        Returns the IfcProject entity from the IFC model. This represents
        the root of the IFC spatial hierarchy, not the application-level
        project metadata.

        **Required scope:** `ifc:read`
      tags:
        - IFC Metadata
      responses:
        '200':
          description: IFC project entity retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '../schemas/ifc.yaml#/IfcProject'
                required:
                  - data
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'

    patch:
      operationId: updateIfcProjectEntity
      summary: Update IFC project metadata
      description: |
        Updates the IfcProject entity metadata (name, description, phase,
        true north). Increments the model version.

        **Required scope:** `ifc:write`
      tags:
        - IFC Metadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Project name
                description:
                  type: string
                  description: Project description
                phase:
                  type: string
                  description: Project phase
      responses:
        '200':
          description: Project entity updated
          headers:
            X-IFC-Version:
              schema:
                type: integer
              description: New model version number
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '../schemas/ifc.yaml#/IfcProject'
                required:
                  - data
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'

  /ifc/files/{fileId}/project/units:
    parameters:
      - $ref: '../schemas/common.yaml#/FileIdParam'

    get:
      operationId: getProjectUnits
      summary: Get project unit assignments
      description: |
        Returns the unit assignments for the IFC project (length, area,
        volume, angle, etc.).

        **Required scope:** `ifc:read`
      tags:
        - IFC Metadata
      responses:
        '200':
          description: Units retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      units:
                        type: array
                        items:
                          $ref: '../schemas/ifc.yaml#/IfcUnitAssignment'
                    required:
                      - units
                required:
                  - data
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'

    patch:
      operationId: updateProjectUnits
      summary: Update project unit assignments
      description: |
        Replaces the unit assignments for the IFC project. Increments
        the model version.

        **Required scope:** `ifc:write`
      tags:
        - IFC Metadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                units:
                  type: array
                  items:
                    $ref: '../schemas/ifc.yaml#/IfcUnitAssignment'
              required:
                - units
      responses:
        '200':
          description: Units updated
          headers:
            X-IFC-Version:
              schema:
                type: integer
              description: New model version number
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      units:
                        type: array
                        items:
                          $ref: '../schemas/ifc.yaml#/IfcUnitAssignment'
                    required:
                      - units
                required:
                  - data
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '422':
          $ref: '../schemas/common.yaml#/UnprocessableEntityError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'

  /ifc/files/{fileId}/element-types:
    parameters:
      - $ref: '../schemas/common.yaml#/FileIdParam'

    get:
      operationId: listElementTypes
      summary: List element type definitions
      description: |
        Returns all element type definitions (IfcTypeObject instances)
        in the IFC model.

        **Required scope:** `ifc:read`
      tags:
        - IFC Metadata
      responses:
        '200':
          description: Element types retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      elementTypes:
                        type: array
                        items:
                          $ref: '../schemas/ifc.yaml#/IfcTypeDefinition'
                    required:
                      - elementTypes
                required:
                  - data
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'

  /ifc/files/{fileId}/coordinate-reference-system:
    parameters:
      - $ref: '../schemas/common.yaml#/FileIdParam'

    get:
      operationId: getCoordinateReferenceSystem
      summary: Get coordinate reference system
      description: |
        Returns the coordinate reference system defined for the IFC model,
        including the origin location and map units.

        **Required scope:** `ifc:read`
      tags:
        - IFC Metadata
      responses:
        '200':
          description: CRS retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '../schemas/ifc.yaml#/IfcCoordinateReferenceSystem'
                required:
                  - data
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'

  /ifc/files/{fileId}/classifications:
    parameters:
      - $ref: '../schemas/common.yaml#/FileIdParam'

    get:
      operationId: listFileClassifications
      summary: List file-level classification systems
      description: |
        Returns all classification systems defined at the file level.
        These are the systems that can be referenced by individual elements.

        **Required scope:** `ifc:read`
      tags:
        - IFC Metadata
      responses:
        '200':
          description: Classifications retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      classifications:
                        type: array
                        items:
                          $ref: '../schemas/ifc.yaml#/IfcClassificationSystem'
                    required:
                      - classifications
                required:
                  - data
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'

    post:
      operationId: createFileClassification
      summary: Create a file-level classification system
      description: |
        Creates a new classification system at the file level. Increments
        the model version.

        **Required scope:** `ifc:write`
      tags:
        - IFC Metadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Classification system name
                  example: "Uniclass 2015"
                source:
                  type: string
                  description: Source organisation
                edition:
                  type: string
                  description: Edition identifier
                  example: "2015"
                editionDate:
                  type: string
                  description: Edition date
              required:
                - name
      responses:
        '201':
          description: Classification system created
          headers:
            X-IFC-Version:
              schema:
                type: integer
              description: New model version number
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '../schemas/ifc.yaml#/IfcClassificationSystem'
                required:
                  - data
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '422':
          $ref: '../schemas/common.yaml#/UnprocessableEntityError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'

  /ifc/files/{fileId}/classifications/{systemId}:
    parameters:
      - $ref: '../schemas/common.yaml#/FileIdParam'
      - name: systemId
        in: path
        required: true
        description: Classification system identifier
        schema:
          type: string

    get:
      operationId: getFileClassification
      summary: Get a classification system
      description: |
        Returns a single classification system by its identifier.

        **Required scope:** `ifc:read`
      tags:
        - IFC Metadata
      responses:
        '200':
          description: Classification system retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '../schemas/ifc.yaml#/IfcClassificationSystem'
                required:
                  - data
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'

    patch:
      operationId: updateFileClassification
      summary: Update a classification system
      description: |
        Updates an existing classification system. Increments the model version.

        **Required scope:** `ifc:write`
      tags:
        - IFC Metadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                source:
                  type: string
                edition:
                  type: string
                editionDate:
                  type: string
      responses:
        '200':
          description: Classification system updated
          headers:
            X-IFC-Version:
              schema:
                type: integer
              description: New model version number
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '../schemas/ifc.yaml#/IfcClassificationSystem'
                required:
                  - data
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'

    delete:
      operationId: deleteFileClassification
      summary: Delete a classification system
      description: |
        Deletes a classification system. Fails with 409 Conflict if
        elements still reference this system.

        **Required scope:** `ifc:delete`
      tags:
        - IFC Metadata
      responses:
        '204':
          description: Classification system deleted
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '409':
          $ref: '../schemas/common.yaml#/ConflictError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'

  /ifc/files/{fileId}/systems:
    parameters:
      - $ref: '../schemas/common.yaml#/FileIdParam'

    get:
      operationId: listSystems
      summary: List MEP and building systems
      description: |
        Returns all systems (e.g. HVAC, electrical, plumbing) defined
        in the IFC model with their member elements.

        **Required scope:** `ifc:read`
      tags:
        - IFC Metadata
      responses:
        '200':
          description: Systems retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '../schemas/ifc.yaml#/IfcSystem'
                required:
                  - data
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'

    post:
      operationId: createSystem
      summary: Create a MEP or building system
      description: |
        Creates a new system (e.g. HVAC, electrical, plumbing). Increments
        the model version.

        **Required scope:** `ifc:write`
      tags:
        - IFC Metadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: System name
                  example: "HVAC System 1"
                description:
                  type: string
                  description: System description
                predefinedType:
                  type: string
                  description: Predefined system type
              required:
                - name
      responses:
        '201':
          description: System created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '../schemas/ifc.yaml#/IfcSystem'
                required:
                  - data
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '422':
          $ref: '../schemas/common.yaml#/UnprocessableEntityError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'

  /ifc/property-set-schemas:
    get:
      operationId: listPropertySetSchemas
      summary: List standard property set schemas
      description: |
        Returns available standard property set schemas (e.g. Pset_WallCommon,
        Pset_SlabCommon) that can be used for validation.

        **Required scope:** `ifc:read`
      tags:
        - IFC Metadata
      responses:
        '200':
          description: Schemas retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      schemas:
                        type: array
                        items:
                          $ref: '../schemas/ifc.yaml#/IfcPsetSchema'
                    required:
                      - schemas
                required:
                  - data
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'
