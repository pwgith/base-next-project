paths:
  /projects:
    get:
      operationId: listProjects
      summary: List all projects
      description: |
        Returns all projects owned by the authenticated user.

        **Required scope:** `ifc:read`
      tags:
        - Projects
      responses:
        '200':
          description: Project list retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      projects:
                        type: array
                        items:
                          $ref: '#/components/schemas/Project'
                    required:
                      - projects
                required:
                  - data
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'

    post:
      operationId: createProject
      summary: Create a new project
      description: |
        Creates a new IFC project with an empty model. The project is
        initialised at version 1 with a default spatial structure.

        **Required scope:** `ifc:write`
      tags:
        - Projects
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Project name (defaults to empty string)
                  example: "Office Building"
                description:
                  type: string
                  description: Optional project description
                  example: "Main office HQ renovation"
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Project'
                required:
                  - data
        '400':
          $ref: '../schemas/common.yaml#/ValidationError'
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '409':
          $ref: '../schemas/common.yaml#/ConflictError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'

  /projects/{projectId}:
    parameters:
      - name: projectId
        in: path
        required: true
        description: UUID of the project
        schema:
          type: string
          format: uuid

    get:
      operationId: getProject
      summary: Get a project by ID
      description: |
        Returns a single project and its current metadata.

        **Required scope:** `ifc:read`
      tags:
        - Projects
      responses:
        '200':
          description: Project retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Project'
                required:
                  - data
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'

    patch:
      operationId: updateProject
      summary: Update a project
      description: |
        Partially updates a project's name and/or description.

        **Required scope:** `ifc:write`
      tags:
        - Projects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: New project name
                  example: "Renamed Project"
                description:
                  type: string
                  description: New project description
                  example: "Updated description"
      responses:
        '200':
          description: Project updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Project'
                required:
                  - data
        '400':
          $ref: '../schemas/common.yaml#/ValidationError'
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '409':
          $ref: '../schemas/common.yaml#/ConflictError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'

    delete:
      operationId: deleteProject
      summary: Delete a project
      description: |
        Permanently deletes a project and all associated IFC data. Requires
        the `confirm=true` query parameter as a safety measure.

        **Required scope:** `ifc:delete`
      tags:
        - Projects
      parameters:
        - name: confirm
          in: query
          required: false
          description: Must be "true" to confirm deletion
          schema:
            type: string
            enum:
              - "true"
      responses:
        '204':
          description: Project deleted
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '409':
          $ref: '../schemas/common.yaml#/ConflictError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'

components:
  schemas:
    Project:
      type: object
      description: IFC project with metadata
      properties:
        projectId:
          type: string
          format: uuid
          description: Unique project identifier
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        name:
          type: string
          description: Project name
          example: "Office Building"
        description:
          type: string
          nullable: true
          description: Project description
          example: "Main office HQ renovation"
        currentIfcVersion:
          type: integer
          description: Current IFC model version number
          example: 1
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp (ISO 8601)
        lastUpdatedAt:
          type: string
          format: date-time
          description: Last update timestamp (ISO 8601)
      required:
        - projectId
        - name
        - currentIfcVersion
        - createdAt
        - lastUpdatedAt
