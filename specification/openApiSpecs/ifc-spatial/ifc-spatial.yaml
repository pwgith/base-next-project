paths:
  /ifc/files/{fileId}/spatial-structure:
    parameters:
      - $ref: '../schemas/common.yaml#/FileIdParam'

    get:
      operationId: getSpatialStructure
      summary: Get full spatial hierarchy
      description: |
        Returns the complete spatial structure tree of the IFC model:
        project → sites → buildings → storeys → spaces, with contained
        element lists at each level.

        **Required scope:** `ifc:read`
      tags:
        - IFC Spatial
      responses:
        '200':
          description: Spatial structure retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '../schemas/ifc.yaml#/IfcSpatialStructure'
                required:
                  - data
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'

  /ifc/files/{fileId}/storeys:
    parameters:
      - $ref: '../schemas/common.yaml#/FileIdParam'

    post:
      operationId: createStorey
      summary: Create a building storey
      description: |
        Creates a new building storey in the spatial structure.
        Increments the model version.

        **Required scope:** `ifc:write`
      tags:
        - IFC Spatial
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Storey name (defaults to empty string)
                  example: "First Floor"
                elevation:
                  type: number
                  description: Storey elevation in metres (defaults to 0)
                  example: 3.2
      responses:
        '201':
          description: Storey created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '../schemas/ifc.yaml#/IfcStoreyWithVersion'
                required:
                  - data
        '400':
          $ref: '../schemas/common.yaml#/ValidationError'
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'

  /ifc/files/{fileId}/storeys/{storeyId}:
    parameters:
      - $ref: '../schemas/common.yaml#/FileIdParam'
      - name: storeyId
        in: path
        required: true
        description: Storey GlobalId
        schema:
          type: string

    get:
      operationId: getStorey
      summary: Get a building storey
      description: |
        Returns a single storey with its spaces and contained element lists.

        **Required scope:** `ifc:read`
      tags:
        - IFC Spatial
      responses:
        '200':
          description: Storey retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '../schemas/ifc.yaml#/IfcBuildingStorey'
                required:
                  - data
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'

    patch:
      operationId: updateStorey
      summary: Update a building storey
      description: |
        Updates the name and/or elevation of a storey. Increments the
        model version.

        **Required scope:** `ifc:write`
      tags:
        - IFC Spatial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: New storey name
                elevation:
                  type: number
                  description: New elevation in metres
      responses:
        '200':
          description: Storey updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '../schemas/ifc.yaml#/IfcBuildingStorey'
                required:
                  - data
        '400':
          $ref: '../schemas/common.yaml#/ValidationError'
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'

    delete:
      operationId: deleteStorey
      summary: Delete a building storey
      description: |
        Deletes a storey. Fails with 409 Conflict if the storey still
        contains elements — elements must be moved or deleted first.

        **Required scope:** `ifc:delete`
      tags:
        - IFC Spatial
      responses:
        '204':
          description: Storey deleted
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '409':
          $ref: '../schemas/common.yaml#/ConflictError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'

  /ifc/files/{fileId}/storeys/{storeyId}/spaces:
    parameters:
      - $ref: '../schemas/common.yaml#/FileIdParam'
      - name: storeyId
        in: path
        required: true
        description: Storey GlobalId
        schema:
          type: string

    get:
      operationId: listStoreySpaces
      summary: List spaces in a storey
      description: |
        Returns all spaces contained within a specific storey.

        **Required scope:** `ifc:read`
      tags:
        - IFC Spatial
      responses:
        '200':
          description: Spaces retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '../schemas/ifc.yaml#/IfcSpace'
                required:
                  - data
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'

  /ifc/files/{fileId}/spaces/{spaceId}:
    parameters:
      - $ref: '../schemas/common.yaml#/FileIdParam'
      - name: spaceId
        in: path
        required: true
        description: Space GlobalId
        schema:
          type: string

    get:
      operationId: getSpace
      summary: Get a space
      description: |
        Returns details of a single space.

        **Required scope:** `ifc:read`
      tags:
        - IFC Spatial
      responses:
        '200':
          description: Space retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '../schemas/ifc.yaml#/IfcSpace'
                required:
                  - data
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'
