# IFC domain schemas

IfcProject:
  type: object
  description: IFC project entity within a file
  properties:
    ifcType:
      type: string
      description: Always "IfcProject"
      example: "IfcProject"
    globalId:
      type: string
      description: 22-character IFC GlobalId
      example: "0EkBQ1RFn5bwJUMlGd3OaE"
    name:
      type: string
      description: Project name
      example: "My Building Project"
    description:
      type: string
      nullable: true
      description: Project description
  required:
    - ifcType
    - globalId
    - name

IfcElement:
  type: object
  description: IFC building element
  properties:
    globalId:
      type: string
      description: 22-character IFC GlobalId
      example: "1hOSvn6df9ABgLv3OWMuNq"
    ifcType:
      type: string
      description: IFC entity type (e.g. IfcWall, IfcSlab, IfcColumn)
      example: "IfcWall"
    name:
      type: string
      description: Element name
      example: "Exterior Wall A"
    description:
      type: string
      nullable: true
      description: Element description
    predefinedType:
      type: string
      nullable: true
      description: Predefined type qualifier
      example: "STANDARD"
    storeyGlobalId:
      type: string
      description: GlobalId of the containing storey
      example: "2RFa0cBzX1bRAm0raJdjt2"
    hostGlobalId:
      type: string
      nullable: true
      description: GlobalId of the host element (for openings, etc.)
  required:
    - globalId
    - ifcType
    - name
    - storeyGlobalId

IfcElementWithVersion:
  allOf:
    - $ref: '#/IfcElement'
    - type: object
      properties:
        version:
          type: integer
          description: IFC model version after the operation
          example: 2
      required:
        - version

IfcBuildingStorey:
  type: object
  description: IFC building storey (floor level)
  properties:
    globalId:
      type: string
      description: 22-character IFC GlobalId
      example: "2RFa0cBzX1bRAm0raJdjt2"
    ifcType:
      type: string
      description: Always "IfcBuildingStorey"
      example: "IfcBuildingStorey"
    name:
      type: string
      description: Storey name
      example: "Ground Floor"
    description:
      type: string
      nullable: true
    elevation:
      type: number
      description: Storey elevation in metres
      example: 0.0
    spaces:
      type: array
      items:
        type: string
      description: GlobalIds of spaces on this storey
    elements:
      type: array
      items:
        type: string
      description: GlobalIds of elements on this storey
  required:
    - globalId
    - ifcType
    - name
    - elevation

IfcStoreyWithVersion:
  allOf:
    - $ref: '#/IfcBuildingStorey'
    - type: object
      properties:
        version:
          type: integer
          description: IFC model version after the operation
          example: 2
      required:
        - version

IfcSpace:
  type: object
  description: IFC space within a storey
  properties:
    globalId:
      type: string
      example: "3nFa0cBzX1bRAm0raJdjt9"
    ifcType:
      type: string
      example: "IfcSpace"
    name:
      type: string
      example: "Living Room"
    longName:
      type: string
      nullable: true
      example: "Main Living Area"
    storeyGlobalId:
      type: string
      description: GlobalId of the containing storey
  required:
    - globalId
    - name
    - storeyGlobalId

IfcPoint3D:
  type: object
  description: 3D coordinate point
  properties:
    x:
      type: number
      example: 0.0
    y:
      type: number
      example: 0.0
    z:
      type: number
      example: 0.0
  required:
    - x
    - y
    - z

IfcPlacement:
  type: object
  description: Element placement in 3D space
  properties:
    globalId:
      type: string
    location:
      $ref: '#/IfcPoint3D'
    direction:
      $ref: '#/IfcPoint3D'
  required:
    - location

IfcGeometryRepresentation:
  type: object
  description: Geometric representation of an element
  properties:
    globalId:
      type: string
    repType:
      type: string
      description: "Representation type: Curve2D, Curve3D, Surface3D, Solid3D"
      example: "Solid3D"
    data:
      description: Geometry data (format depends on repType)

IfcProperty:
  type: object
  description: Single property within a property set
  properties:
    name:
      type: string
      description: Property name
      example: "IsExternal"
    type:
      type: string
      description: Property value type (string, number, boolean)
      example: "boolean"
    value:
      description: Property value
      example: true
  required:
    - name
    - type
    - value

IfcPropertySet:
  type: object
  description: Named set of properties attached to an element
  properties:
    name:
      type: string
      description: Property set name
      example: "Pset_WallCommon"
    globalId:
      type: string
      description: 22-character IFC GlobalId
    properties:
      type: array
      items:
        $ref: '#/IfcProperty'
  required:
    - name
    - globalId
    - properties

IfcQuantitySet:
  type: object
  description: Named set of quantities attached to an element
  properties:
    name:
      type: string
      example: "Qto_WallBaseQuantities"
    globalId:
      type: string
    quantities:
      type: array
      items:
        type: object
        properties:
          name:
            type: string
            example: "Length"
          type:
            type: string
            example: "IfcQuantityLength"
          value:
            description: Quantity value
            example: 5.0
        required:
          - name
          - type
          - value
  required:
    - name
    - globalId
    - quantities

IfcMaterial:
  type: object
  description: Material definition
  properties:
    globalId:
      type: string
      example: "4aFa0cBzX1bRAm0raJdjt5"
    name:
      type: string
      example: "Concrete"
    description:
      type: string
      nullable: true
    category:
      type: string
      nullable: true
      example: "Structural"
  required:
    - globalId
    - name

IfcMaterialAssignment:
  type: object
  description: Material assignment to an element
  properties:
    elementGlobalId:
      type: string
    materialGlobalId:
      type: string
    role:
      type: string
      nullable: true
      example: "LoadBearing"
  required:
    - elementGlobalId
    - materialGlobalId

IfcMaterialLayer:
  type: object
  description: Layer within a layered material
  properties:
    globalId:
      type: string
    name:
      type: string
      nullable: true
    material:
      $ref: '#/IfcMaterial'
    thickness:
      type: number
      description: Layer thickness in metres
      example: 0.2
    isVentilated:
      type: boolean
      nullable: true
  required:
    - material
    - thickness

IfcClassificationSystem:
  type: object
  description: Classification system (e.g. Uniclass, OmniClass)
  properties:
    globalId:
      type: string
    name:
      type: string
      example: "Uniclass 2015"
    edition:
      type: string
      nullable: true
      example: "2015"
  required:
    - name

IfcClassificationReference:
  type: object
  description: Classification reference applied to an element
  properties:
    globalId:
      type: string
    name:
      type: string
      example: "Ss_25_10_30"
    itemReference:
      type: string
      nullable: true
      example: "Ss_25_10_30"
    system:
      $ref: '#/IfcClassificationSystem'
  required:
    - globalId
    - name

IfcGroup:
  type: object
  description: Named group of elements
  properties:
    globalId:
      type: string
    name:
      type: string
      example: "Fire Safety Zone A"
    description:
      type: string
      nullable: true
    members:
      type: array
      items:
        type: string
      description: GlobalIds of member elements
  required:
    - globalId
    - name
    - members

IfcSystem:
  type: object
  description: MEP or building system
  properties:
    globalId:
      type: string
    name:
      type: string
      example: "HVAC System 1"
    description:
      type: string
      nullable: true
    members:
      type: array
      items:
        type: string
      description: GlobalIds of member elements
  required:
    - globalId
    - name
    - members

IfcCoordinateReferenceSystem:
  type: object
  description: Coordinate reference system for the IFC model
  properties:
    name:
      type: string
      example: "EPSG:27700"
    location:
      $ref: '#/IfcPoint3D'
    mapUnits:
      type: string
      example: "METRE"
  required:
    - name
    - location
    - mapUnits

IfcTypeDefinition:
  type: object
  description: Element type definition
  properties:
    globalId:
      type: string
    name:
      type: string
      example: "Standard Wall Type"
    description:
      type: string
      nullable: true
    typeName:
      type: string
      example: "IfcWallType"
    applicableEntities:
      type: array
      items:
        type: string
      description: IFC types this definition applies to
  required:
    - globalId
    - name
    - typeName

IfcSpatialContainment:
  type: object
  description: Spatial containment relationship
  properties:
    storeyGlobalId:
      type: string
      description: GlobalId of the containing storey
    storeyName:
      type: string
      description: Name of the containing storey
  required:
    - storeyGlobalId

IfcOpeningElement:
  type: object
  description: Opening element (void in a wall, slab, etc.)
  properties:
    globalId:
      type: string
      description: 22-character IFC GlobalId
      example: "3EFb1cDzX1bRAm0raJdjt8"
    name:
      type: string
      description: Opening name
      example: "Door Opening 1"
    ifcType:
      type: string
      description: Always "IfcOpeningElement"
      example: "IfcOpeningElement"
    hostElementGlobalId:
      type: string
      description: GlobalId of the host element containing this opening
    placement:
      type: object
      properties:
        x:
          type: number
        y:
          type: number
        z:
          type: number
      required:
        - x
        - y
        - z
    dimensions:
      type: object
      properties:
        width:
          type: number
        height:
          type: number
      required:
        - width
        - height
    fillingGlobalId:
      type: string
      nullable: true
      description: GlobalId of the element filling this opening (e.g. a door or window)
  required:
    - globalId
    - name
    - ifcType
    - hostElementGlobalId
    - placement
    - dimensions

IfcOpeningElementWithVersion:
  allOf:
    - $ref: '#/IfcOpeningElement'
    - type: object
      properties:
        version:
          type: integer
          description: IFC model version after the operation
          example: 2
      required:
        - version

IfcDistributionPort:
  type: object
  description: Distribution port on an element for MEP connections
  properties:
    portId:
      type: string
      description: Port identifier
      example: "5FFb1cDzX1bRAm0raJdjt7"
    name:
      type: string
      description: Port name
      example: "Inlet Port"
    ifcType:
      type: string
      description: Always "IfcDistributionPort"
      example: "IfcDistributionPort"
    elementGlobalId:
      type: string
      description: GlobalId of the element this port belongs to
    flowDirection:
      type: string
      description: Flow direction (SOURCE, SINK, SOURCEANDSINK, NOTDEFINED)
      example: "SOURCE"
    systemType:
      type: string
      nullable: true
      description: System type (e.g. VENTILATION, DRAINAGE)
      example: "VENTILATION"
  required:
    - portId
    - name
    - ifcType
    - elementGlobalId
    - flowDirection

IfcDistributionPortWithVersion:
  allOf:
    - $ref: '#/IfcDistributionPort'
    - type: object
      properties:
        version:
          type: integer
          description: IFC model version after the operation
          example: 2
      required:
        - version

IfcPortConnection:
  type: object
  description: Connection between two elements via ports
  properties:
    connectionId:
      type: string
      description: Connection identifier
      example: "6GGb1cDzX1bRAm0raJdjt6"
    relatingElementGlobalId:
      type: string
      description: GlobalId of the source element
    relatedElementGlobalId:
      type: string
      description: GlobalId of the target element
    sourcePortId:
      type: string
      nullable: true
      description: Port identifier on the source element
    targetPortId:
      type: string
      nullable: true
      description: Port identifier on the target element
  required:
    - connectionId
    - relatingElementGlobalId
    - relatedElementGlobalId

IfcPortConnectionWithVersion:
  allOf:
    - $ref: '#/IfcPortConnection'
    - type: object
      properties:
        version:
          type: integer
          description: IFC model version after the operation
          example: 2
      required:
        - version

IfcMaterialConstituent:
  type: object
  description: Constituent within a material constituent set
  properties:
    materialName:
      type: string
      description: Name of the material
      example: "Concrete"
    name:
      type: string
      description: Constituent name
      example: "Core"
    fraction:
      type: number
      nullable: true
      description: Fraction of the constituent (0 to 1)
      example: 0.8
    category:
      type: string
      nullable: true
      description: Constituent category
      example: "Structural"
  required:
    - materialName
    - name

IfcUnitAssignment:
  type: object
  description: Unit assignment for the IFC project
  properties:
    unitType:
      type: string
      description: Type of unit (e.g. LENGTHUNIT, AREAUNIT, VOLUMEUNIT)
      example: "LENGTHUNIT"
    name:
      type: string
      description: Unit name (e.g. METRE, SQUARE_METRE)
      example: "METRE"
    prefix:
      type: string
      nullable: true
      description: SI prefix (e.g. MILLI, CENTI)
      example: "MILLI"
  required:
    - unitType
    - name

IfcSpatialStructure:
  type: object
  description: Full spatial hierarchy of the IFC model
  properties:
    project:
      $ref: '#/IfcProject'
    sites:
      type: array
      items:
        type: object
        properties:
          globalId:
            type: string
          name:
            type: string
          buildings:
            type: array
            items:
              type: object
              properties:
                globalId:
                  type: string
                name:
                  type: string
                storeys:
                  type: array
                  items:
                    type: object
                    properties:
                      globalId:
                        type: string
                      name:
                        type: string
                      elevation:
                        type: number
                      spaces:
                        type: array
                        items:
                          type: string
                      elements:
                        type: array
                        items:
                          type: string

IfcPsetSchema:
  type: object
  description: Standard property set schema definition
  properties:
    name:
      type: string
      description: Property set name
      example: "Pset_WallCommon"
    applicableTo:
      type: array
      items:
        type: string
      description: IFC types this schema applies to
      example: ["IfcWall"]
    properties:
      type: array
      items:
        type: object
        properties:
          name:
            type: string
            example: "IsExternal"
          type:
            type: string
            example: "boolean"
          required:
            type: boolean
            example: false
        required:
          - name
          - type
  required:
    - name
    - properties

VersionMetadata:
  type: object
  description: Version history entry
  properties:
    versionNumber:
      type: integer
      description: Version number
      example: 3
    createdAt:
      type: string
      format: date-time
      description: When this version was created
    createdBy:
      type: string
      nullable: true
      description: User identity who created this version
    changeDescription:
      type: string
      nullable: true
      description: Description of what changed
      example: "Added exterior wall"
  required:
    - versionNumber
    - createdAt
