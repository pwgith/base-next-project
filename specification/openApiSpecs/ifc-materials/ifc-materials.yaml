paths:
  /ifc/files/{fileId}/materials:
    parameters:
      - $ref: '../schemas/common.yaml#/FileIdParam'

    get:
      operationId: listMaterials
      summary: List file-level materials
      description: |
        Returns all materials defined in the IFC file's material library.

        **Required scope:** `ifc:read`
      tags:
        - IFC Materials
      responses:
        '200':
          description: Materials retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      materials:
                        type: array
                        items:
                          $ref: '../schemas/ifc.yaml#/IfcMaterial'
                    required:
                      - materials
                required:
                  - data
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'

    post:
      operationId: createMaterial
      summary: Create a material
      description: |
        Creates a new material in the file's material library.

        **Required scope:** `ifc:write`
      tags:
        - IFC Materials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Material name
                  example: "Concrete C30/37"
                description:
                  type: string
                  description: Material description
                category:
                  type: string
                  description: Material category
                  example: "Structural"
              required:
                - name
      responses:
        '201':
          description: Material created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '../schemas/ifc.yaml#/IfcMaterial'
                required:
                  - data
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '422':
          $ref: '../schemas/common.yaml#/UnprocessableEntityError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'

  /ifc/files/{fileId}/elements/{globalId}/material/layers:
    parameters:
      - $ref: '../schemas/common.yaml#/FileIdParam'
      - $ref: '../schemas/common.yaml#/GlobalIdParam'

    get:
      operationId: listMaterialLayers
      summary: List material layers
      description: |
        Returns all layers in an element's layered material assignment.

        **Required scope:** `ifc:read`
      tags:
        - IFC Materials
      responses:
        '200':
          description: Layers retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '../schemas/ifc.yaml#/IfcMaterialLayer'
                required:
                  - data
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'

  /ifc/files/{fileId}/materials/{materialId}/assignments:
    parameters:
      - $ref: '../schemas/common.yaml#/FileIdParam'
      - name: materialId
        in: path
        required: true
        description: Material identifier
        schema:
          type: string

    post:
      operationId: bulkAssignMaterial
      summary: Bulk assign material to elements
      description: |
        Assigns a material to multiple elements at once. Returns a summary
        of the assignment results. May return 207 Multi-Status if some
        assignments fail.

        **Required scope:** `ifc:write`
      tags:
        - IFC Materials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                elementGlobalIds:
                  type: array
                  items:
                    type: string
                  description: GlobalIds of elements to assign the material to
              required:
                - elementGlobalIds
      responses:
        '200':
          description: All assignments succeeded
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      assignedCount:
                        type: integer
                        description: Number of elements assigned
                      materialName:
                        type: string
                        description: Name of the assigned material
                    required:
                      - assignedCount
                      - materialName
                required:
                  - data
        '207':
          description: Partial success — some assignments failed
          headers:
            X-IFC-Version:
              schema:
                type: integer
              description: New model version number
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      succeeded:
                        type: array
                        items:
                          type: string
                        description: GlobalIds of successfully assigned elements
                      failed:
                        type: array
                        items:
                          type: string
                        description: GlobalIds of elements where assignment failed
                    required:
                      - succeeded
                      - failed
                required:
                  - data
        '401':
          $ref: '../schemas/common.yaml#/UnauthorizedError'
        '403':
          $ref: '../schemas/common.yaml#/ForbiddenError'
        '404':
          $ref: '../schemas/common.yaml#/NotFoundError'
        '500':
          $ref: '../schemas/common.yaml#/InternalError'
