openapi: "3.0.3"
info:
  title: IFC Model API
  version: "1.0.0"
  description: |
    Public REST API for managing IFC (Industry Foundation Classes) building
    information models. Provides CRUD operations for projects, IFC files,
    building elements, spatial structure, materials, classifications, groups,
    versioning, and model export.

    ## Authentication

    All endpoints require an **OAuth 2.0 Bearer token** in the `Authorization`
    header. Tokens must include the appropriate scope for the requested operation:

    | Scope | Access |
    |-------|--------|
    | `ifc:read` | Read projects, files, elements, versions, and metadata |
    | `ifc:write` | Create and modify projects, files, elements, and related data |
    | `ifc:delete` | Delete projects, files, elements, and related data |

    ## Response Envelope

    All JSON responses use a consistent envelope:

    - **Success**: `{ "data": { ... } }`
    - **Error**: `{ "error": { "message": "..." } }`

    Binary download endpoints return raw file content with `Content-Disposition` headers.

servers:
  - url: http://localhost:3000/api/v1
    description: Local development
  - url: https://api.example.com/api/v1
    description: Production

security:
  - bearerAuth: []

tags:
  - name: Projects
    description: Project CRUD operations
  - name: IFC Files
    description: IFC file upload, listing, and deletion
  - name: IFC Elements
    description: Building element CRUD and sub-resources (property sets, classifications, material, geometry, placement, type, spatial containment, quantity sets)
  - name: IFC Versioning
    description: Version history, metadata, download, and restore
  - name: IFC Spatial
    description: Storeys and spaces within the spatial structure
  - name: IFC Groups
    description: Element groups and group membership
  - name: IFC Materials
    description: File-level material library and element material assignments
  - name: IFC Export
    description: Export and download IFC files in various formats
  - name: IFC Metadata
    description: File-level metadata — project entity, element types, coordinate reference system, classifications, and systems

