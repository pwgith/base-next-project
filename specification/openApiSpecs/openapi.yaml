components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OAuth 2.0 Bearer token with scopes (ifc:read, ifc:write, ifc:delete)

  schemas:
    # Common schemas
    ErrorResponse:
      $ref: './schemas/common.yaml#/ErrorResponse'
    # IFC schemas referenced from area files
